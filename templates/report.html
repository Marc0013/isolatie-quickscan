<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>$pagetitle$</title>
<style>
  :root {
    --navy:       #0B1F3A;
    --navy-light: #1C3A6B;
    --accent:     #2E6BE6;
    --accent-2:   #3DBDBD;
    --gold:       #C9A84C;
    --light-bg:   #F4F6FA;
    --white:      #FFFFFF;
    --text:       #1A2340;
    --text-muted: #5A6A85;
    --border:     #D0D8EC;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ── PAGINA-INSTELLING (WeasyPrint / Prince) ── */
  @page {
    size: A4;
    /* Geen linker/rechter/bovenste marge — de cover loopt tot de papierrand.
       Alleen onderaan ruimte voor het paginanummer. */
    margin: 0 0 22mm 0;
    @bottom-right {
      content: "Pagina " counter(page) " van " counter(pages);
      font-size: 7.5pt;
      color: #5A6A85;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      padding-right: 18mm;
      padding-bottom: 6mm;
    }
  }

  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-size: 10pt;
    color: var(--text);
    background: var(--white);
    line-height: 1.65;
    /* Geen body-margin: de cover staat direct aan de papierrand */
    margin: 0;
  }

  /* ── CONTENT-WRAPPER — simuleert de paginamarges voor alle content ── */
  .page-wrapper {
    padding: 0 18mm;
  }

  /* ── COVER — beeldvullend, buiten de page-wrapper ── */
  .cover {
    /* Staat buiten .page-wrapper: loopt van linker tot rechter papierrand (595pt / A4-breedte) */
    background: var(--navy);
    padding: 36pt 48pt 0;
  }
  .cover-bar {
    height: 4pt;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 55%, var(--gold) 100%);
    margin-top: 28pt;
  }
  .cover-top {
    display: table;
    width: 100%;
    margin-bottom: 32pt;
  }
  .cover-left  { display: table-cell; vertical-align: top; }
  .cover-right { display: table-cell; vertical-align: top; text-align: right; }

  .brand {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 24pt;
    font-weight: bold;
    color: var(--white);
  }
  .brand span { color: var(--accent-2); }

  .report-type {
    font-size: 7pt;
    font-weight: 600;
    letter-spacing: 3pt;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-top: 5pt;
  }

  .cover-meta {
    color: rgba(255,255,255,0.45);
    font-size: 8pt;
    line-height: 2;
  }

  .cover-address {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 19pt;
    font-weight: bold;
    color: var(--white);
    margin-bottom: 8pt;
  }

  .cover-sub {
    color: rgba(255,255,255,0.45);
    font-size: 9pt;
    padding-bottom: 28pt;
  }

  /* ── CONTENT ────────────────────────────────── */
  .content {
    /* Horizontale padding wordt afgehandeld door .page-wrapper */
    padding: 28pt 0 24pt;
  }

  /* Intro-alinea direct onder de cover */
  .content > p:first-child {
    font-size: 10pt;
    color: var(--text-muted);
    line-height: 1.8;
    margin-bottom: 26pt;
    padding-bottom: 18pt;
    border-bottom: 1pt solid var(--border);
  }

  /* ── HEADINGS ───────────────────────────────── */
  h1 { display: none; }

  h2 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 13pt;
    font-weight: bold;
    color: var(--navy);
    margin: 30pt 0 13pt;
    padding: 0 0 9pt 12pt;
    border-left: 3.5pt solid var(--accent);
    border-bottom: 1.5pt solid var(--border);
    clear: both;
  }

  /* Eerste h2 iets minder ruimte erboven */
  .content > h2:first-of-type {
    margin-top: 18pt;
  }

  h3 {
    font-size: 10.5pt;
    font-weight: 600;
    color: var(--navy-light);
    margin: 20pt 0 8pt;
    padding-left: 9pt;
    border-left: 2pt solid var(--accent-2);
    clear: both;
  }

  p {
    font-size: 9.5pt;
    margin-bottom: 12pt;
    line-height: 1.75;
  }

  /* Laatste alinea voor een volgende kop geen extra ruimte */
  p + h2, p + h3 { margin-top: 24pt; }

  strong { font-weight: 600; color: var(--navy); }
  em { font-style: italic; color: var(--text-muted); }

  /* ── LISTS ──────────────────────────────────── */
  ul, ol {
    margin: 8pt 0 18pt 0;
    padding: 0;
    list-style: none;
    clear: both;
    display: block;
    width: 100%;
    border: 1pt solid var(--border);
    border-radius: 4pt;
    overflow: hidden;
  }

  ul li, ol li {
    display: block;
    width: 100%;
    padding: 8pt 10pt 8pt 26pt;
    position: relative;
    font-size: 9.5pt;
    line-height: 1.65;
    background: var(--white);
  }

  /* Scheidingslijn tussen items (niet na het laatste) */
  ul li + li, ol li + li {
    border-top: 1pt solid var(--border);
  }

  /* Subtiele afwisselende achtergrond voor leesbaarheid */
  ul li:nth-child(even), ol li:nth-child(even) {
    background: var(--light-bg);
  }

  ul li::before {
    content: '→';
    position: absolute;
    left: 8pt;
    color: var(--accent);
    font-weight: 700;
  }

  ol { counter-reset: item; }
  ol li { counter-increment: item; }
  ol li::before {
    content: counter(item) '.';
    position: absolute;
    left: 8pt;
    color: var(--accent);
    font-weight: 700;
    font-size: 8.5pt;
  }

  /* ── TABLES ─────────────────────────────────── */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    margin: 8pt 0 18pt 0;
    font-size: 9.5pt;
    clear: both;
    border: 1pt solid var(--border);
    border-radius: 4pt;
    overflow: hidden;
  }

  .data-table thead tr {
    background: var(--navy);
    color: var(--white);
  }

  .data-table th {
    padding: 9pt 12pt;
    text-align: left;
    font-weight: 600;
    font-size: 8.5pt;
    letter-spacing: 0.3pt;
    border-right: 1pt solid rgba(255,255,255,0.1);
  }

  .data-table th:last-child { border-right: none; }

  .data-table tbody tr {
    background: var(--white);
  }

  .data-table tbody tr:nth-child(even) {
    background: var(--light-bg);
  }

  .data-table tbody tr + tr {
    border-top: 1pt solid var(--border);
  }

  .data-table td {
    padding: 8pt 12pt;
    vertical-align: top;
    line-height: 1.65;
    border-right: 1pt solid var(--border);
  }

  .data-table td:last-child { border-right: none; }

  .data-table td:first-child {
    font-weight: 600;
    color: var(--navy);
    white-space: nowrap;
  }

  /* ── BLOCKQUOTE ─────────────────────────────── */
  blockquote {
    background: var(--light-bg);
    border-left: 3pt solid var(--accent);
    border-radius: 0 4pt 4pt 0;
    padding: 12pt 16pt;
    margin: 22pt 0 8pt;
    clear: both;
    display: block;
  }

  blockquote p {
    font-size: 8pt;
    color: var(--text-muted);
    margin: 0;
    font-style: italic;
    line-height: 1.7;
  }

  /* ── PAGINANUMMER (wkhtmltopdf fallback) ────── */
  /*
   * WeasyPrint gebruikt de @page-regel hierboven.
   * Bij wkhtmltopdf: voeg --footer-right "Pagina [page] van [toPage]"
   * toe als CLI-optie, of gebruik --footer-html met een apart bestand.
   */
  .page-number {
    position: fixed;
    bottom: 9pt;
    right: 48pt;
    font-size: 7.5pt;
    color: var(--text-muted);
    display: none;
  }
  @media print {
    .page-number { display: block; }
  }

  /* ── FOOTER ─────────────────────────────────── */
  .footer {
    background: var(--navy);
    /* Laat de footer uitlopen tot de randen van de page-wrapper */
    padding: 12pt 48pt;
    display: table;
    width: 100%;
    margin-top: 28pt;
    clear: both;
  }

  .footer-left  { display: table-cell; vertical-align: middle; }
  .footer-right { display: table-cell; vertical-align: middle; text-align: right; }

  .footer-brand {
    font-family: Georgia, serif;
    font-size: 11pt;
    font-weight: bold;
    color: rgba(255,255,255,0.5);
  }
  .footer-brand span { color: var(--accent-2); }

  .footer-note {
    font-size: 7.5pt;
    color: rgba(255,255,255,0.3);
    line-height: 1.7;
  }

  @media print {
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<!-- COVER: buiten de page-wrapper — loopt over de volledige paginabreedte (A4 = 595pt) -->
<div class="cover">
  <div class="cover-top">
    <div class="cover-left">
      <div class="brand">Pand<span>IQ</span></div>
      <div class="report-type">Isolatie Quickscan</div>
    </div>
    <div class="cover-right">
      <div class="cover-meta">$date$<br>Automatisch gegenereerd<br>Onafhankelijk inzicht</div>
    </div>
  </div>
  <div class="cover-address">$pagetitle$</div>
  <div class="cover-sub">Verduurzamingsadvies op basis van BAG &amp; EP-Online registraties</div>
  <div class="cover-bar"></div>
</div>

<!-- PAGE-WRAPPER: simuleert de paginamarges voor alle content na de cover -->
<div class="page-wrapper">

  <div class="content">
$body$
  </div>

  <!--
    Paginanummer-element voor wkhtmltopdf.
    wkhtmltopdf geeft ?page=N&topage=M mee in de URL van footer-HTML bestanden.
    In het hoofddocument werkt deze substitutie via het script hieronder.
  -->
  <div class="page-number" id="page-number"></div>

  <div class="footer">
    <div class="footer-left">
      <div class="footer-brand">Pand<span>IQ</span></div>
    </div>
    <div class="footer-right">
      <div class="footer-note">Automatisch gegenereerd rapport<br>Indicatief · gebaseerd op openbare registraties</div>
    </div>
  </div>

</div><!-- /page-wrapper -->

<script>
  /* Paginanummer invullen wanneer wkhtmltopdf page/topage via URL meegeeft */
  (function () {
    var params = {};
    window.location.search.slice(1).split('&').forEach(function (pair) {
      var kv = pair.split('=');
      if (kv.length === 2) params[kv[0]] = decodeURIComponent(kv[1]);
    });
    var el = document.getElementById('page-number');
    if (el && params.page) {
      el.textContent = 'Pagina ' + params.page + (params.topage ? ' van ' + params.topage : '');
    }
  })();
</script>

</body>
</html>
